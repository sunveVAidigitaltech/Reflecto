plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vaidigitaltech.reflecto'
    compileSdk 35

    defaultConfig {
        applicationId "com.vaidigitaltech.reflecto"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("reflecto-release-key.jks")
            storePassword System.getenv("REFLECTO_KEYSTORE_PASSWORD") ?: "ReflectoPlay2026!"
            keyAlias "reflecto-key"
            keyPassword System.getenv("REFLECTO_KEY_PASSWORD") ?: "ReflectoPlay2026!"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
